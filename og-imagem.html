<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#fff;font-family:Geist,'Segoe UI',sans-serif;display:flex;overflow:hidden}
.faixa{width:16px;background:#D8121B}
.corpo{flex:1;padding:74px 80px;display:flex;flex-direction:column;justify-content:space-between}
.topo{display:flex;align-items:center;gap:30px}
.selo{width:132px;height:132px;flex:none}
h1{font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-size:76px;font-weight:800;letter-spacing:-2px;color:#16110f;line-height:.95}
.sub{font-size:27px;color:#D8121B;font-weight:600;margin-top:10px;letter-spacing:.3px}
.frase{font-size:41px;color:#3d3330;line-height:1.32;font-weight:500;max-width:900px}
.frase b{color:#16110f;font-weight:600}
.pe{display:flex;align-items:center;gap:18px;font-size:25px;color:#6b5f5b}
.pilula{background:#D8121B;color:#fff;font-weight:600;padding:13px 26px;border-radius:999px;font-size:25px}
.pt{width:7px;height:7px;border-radius:50%;background:#c9bfbb;flex:none}
</style></head><body>
<div class="faixa"></div>
<div class="corpo">
  <div class="topo">
    <svg class="selo" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#D8121B"/>
      <text x="60" y="42" text-anchor="middle" fill="#fff" font-family="Geist,sans-serif" font-size="11" letter-spacing="1.6">DROGARIA</text>
      <text x="60" y="70" text-anchor="middle" fill="#fff" font-family="Bricolage Grotesque,sans-serif" font-size="27" font-weight="800">Munhoz</text>
      <path d="M55 82h10v8h8v10h-8v8H55v-8h-8V90h8z" fill="#fff"/></svg>
    <div><h1>Drogaria Munhoz</h1><div class="sub">Agudos — SP</div></div>
  </div>
  <div class="frase">Monte sua lista pelo site e <b>receba em casa no mesmo dia</b>.</div>
  <div class="pe"><span class="pilula">Pedido pelo WhatsApp</span><span class="pt"></span><span>Rua 13 de Maio, 807 — Centro</span><span class="pt"></span><span>08h às 21h</span></div>
</div></body></html>
